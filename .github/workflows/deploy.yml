name: CI/CD Pipeline - Backend Ventas

on:
  push:
    branches:
      - deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/innovatech-back-ventas:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to EC2 Backend via Bastion
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_BACK_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.EC2_FRONT_IP }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Crear red docker si no existe
            docker network create innova-network || true
            
            # Detener y eliminar contenedor existente si existe
            docker stop back-ventas || true
            docker rm back-ventas || true
            
            # Limpiar imágenes viejas
            docker image prune -f || true
            
            # Pull de la nueva imagen
            docker pull ${{ secrets.DOCKER_USERNAME }}/innovatech-back-ventas:latest
            
            # Correr contenedor (mapeando puerto 8082 del host al 8080 del contenedor)
            docker run -d \
              --name back-ventas \
              -p 8082:8080 \
              --network=innova-network \
              -e DB_ENDPOINT=${{ secrets.EC2_DATA_IP }} \
              -e DB_PORT=3306 \
              -e DB_NAME=innovadb \
              -e DB_USERNAME=user_admin \
              -e DB_PASSWORD=password123 \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/innovatech-back-ventas:latest
